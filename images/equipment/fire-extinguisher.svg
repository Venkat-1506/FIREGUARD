<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C62828"/>
      <stop offset="30%" style="stop-color:#D32F2F"/>
      <stop offset="70%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF5350;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#EF5350;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Handle/Lever -->
    <rect x="165" y="40" width="70" height="14" rx="7" fill="#424242"/>
    <rect x="180" y="28" width="40" height="20" rx="4" fill="#616161"/>
    <rect x="192" y="20" width="16" height="14" rx="3" fill="#757575"/>
    <!-- Pressure Gauge -->
    <circle cx="200" cy="85" r="22" fill="#FAFAFA" stroke="#424242" stroke-width="2.5"/>
    <circle cx="200" cy="85" r="17" fill="#FFFFFF"/>
    <line x1="200" y1="85" x2="210" y2="75" stroke="#D32F2F" stroke-width="2" stroke-linecap="round"/>
    <circle cx="200" cy="85" r="2.5" fill="#424242"/>
    <!-- Green zone arc -->
    <path d="M 190 75 A 14 14 0 0 1 210 75" fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Nozzle/Siphon Tube -->
    <rect x="172" y="54" width="8" height="35" rx="2" fill="#757575"/>
    <!-- Safety Pin -->
    <circle cx="168" cy="50" r="5" fill="#FFC107" stroke="#F57F17" stroke-width="1.5"/>
    <line x1="168" y1="55" x2="168" y2="70" stroke="#F57F17" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Main Body -->
    <rect x="135" y="72" width="130" height="330" rx="16" fill="url(#body-grad)"/>
    <rect x="135" y="72" width="55" height="330" rx="16" fill="url(#highlight)"/>
    <!-- Body highlight -->
    <rect x="145" y="90" width="25" height="280" rx="12" fill="#EF5350" opacity="0.25"/>
    <!-- Label Area -->
    <rect x="150" y="160" width="100" height="140" rx="8" fill="#FFFFFF" opacity="0.95"/>
    <rect x="150" y="160" width="100" height="30" rx="8" fill="#D32F2F"/>
    <text x="200" y="182" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">FIRE</text>
    <!-- Instructions lines -->
    <rect x="162" y="200" width="76" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="210" width="60" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="220" width="70" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="230" width="50" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="245" width="76" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="255" width="65" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="265" width="55" height="4" rx="2" fill="#E0E0E0"/>
    <rect x="162" y="280" width="45" height="4" rx="2" fill="#E0E0E0"/>
    <!-- Bottom ring -->
    <rect x="130" y="385" width="140" height="16" rx="8" fill="#B71C1C"/>
    <!-- Base -->
    <rect x="140" y="395" width="120" height="10" rx="5" fill="#424242"/>
  </g>
</svg>