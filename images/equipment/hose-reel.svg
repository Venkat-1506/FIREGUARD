<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="reel-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F"/>
      <stop offset="50%" style="stop-color:#C62828"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="hose-color" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="wall-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="100%" style="stop-color:#EEEEEE"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Wall -->
  <rect x="0" y="0" width="400" height="400" fill="url(#wall-grad)"/>
  <g filter="url(#shadow4)">
    <!-- Wall mount plate -->
    <rect x="80" y="60" width="240" height="280" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
    <!-- Cabinet door frame -->
    <rect x="95" y="75" width="210" height="250" rx="6" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Glass/transparent panel -->
    <rect x="100" y="80" width="200" height="240" rx="4" fill="#E3F2FD" opacity="0.3"/>
    <!-- Reel drum - outer -->
    <circle cx="200" cy="195" r="85" fill="url(#reel-metal)" stroke="#B71C1C" stroke-width="3"/>
    <!-- Reel drum - inner hub -->
    <circle cx="200" cy="195" r="30" fill="#C62828" stroke="#B71C1C" stroke-width="2"/>
    <!-- Reel spokes -->
    <line x1="200" y1="110" x2="200" y2="165" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="225" x2="200" y2="280" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <line x1="115" y1="195" x2="170" y2="195" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <line x1="230" y1="195" x2="285" y2="195" stroke="#B71C1C" stroke-width="4" stroke-linecap="round"/>
    <!-- Hose wrapped on reel -->
    <circle cx="200" cy="195" r="70" fill="none" stroke="url(#hose-color)" stroke-width="12" opacity="0.9"/>
    <circle cx="200" cy="195" r="55" fill="none" stroke="#C62828" stroke-width="10" opacity="0.7"/>
    <circle cx="200" cy="195" r="43" fill="none" stroke="#D32F2F" stroke-width="8" opacity="0.5"/>
    <!-- Center bolt -->
    <circle cx="200" cy="195" r="10" fill="#9E9E9E" stroke="#757575" stroke-width="2"/>
    <circle cx="200" cy="195" r="4" fill="#BDBDBD"/>
    <!-- Hose outlet / nozzle at bottom -->
    <rect x="188" y="275" width="24" height="15" rx="3" fill="#757575"/>
    <rect x="192" y="290" width="16" height="25" rx="2" fill="#616161"/>
    <!-- Nozzle tip -->
    <rect x="190" y="315" width="20" height="10" rx="3" fill="#424242"/>
    <!-- Door handle -->
    <rect x="295" y="180" width="8" height="30" rx="4" fill="#BDBDBD"/>
    <!-- Status label -->
    <rect x="115" y="335" width="170" height="22" rx="4" fill="#D32F2F"/>
    <text x="200" y="350" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">FIRE HOSE REEL</text>
    <!-- Bottom cabinet edge -->
    <rect x="95" y="325" width="210" height="5" rx="2" fill="#E0E0E0"/>
  </g>
</svg>