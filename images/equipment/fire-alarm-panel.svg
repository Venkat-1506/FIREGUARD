<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="panel-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8E8E8"/>
      <stop offset="30%" style="stop-color:#F5F5F5"/>
      <stop offset="70%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#D8D8D8"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="3" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#shadow3)">
    <!-- Back plate / wall mount -->
    <rect x="100" y="30" width="200" height="420" rx="12" fill="url(#panel-body)" stroke="#BDBDBD" stroke-width="2"/>
    <!-- Top section - Fire indicator -->
    <rect x="120" y="50" width="160" height="60" rx="8" fill="#D32F2F"/>
    <text x="200" y="75" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">FIRE</text>
    <text x="200" y="95" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#FFCDD2">ALARM CONTROL</text>
    <!-- LCD Display -->
    <rect x="125" y="125" width="150" height="50" rx="4" fill="url(#screen-grad)"/>
    <text x="200" y="148" text-anchor="middle" font-family="monospace" font-size="10" fill="#A5D6A7">SYSTEM NORMAL</text>
    <text x="200" y="163" text-anchor="middle" font-family="monospace" font-size="9" fill="#66BB6A">ZONE: ALL OK</text>
    <!-- LED indicators row -->
    <g transform="translate(130, 190)">
      <circle cx="15" cy="15" r="7" fill="#4CAF50" stroke="#388E3C" stroke-width="1.5"/>
      <text x="15" y="35" text-anchor="middle" font-family="Arial" font-size="7" fill="#757575">PWR</text>
      <circle cx="50" cy="15" r="7" fill="#4CAF50" stroke="#388E3C" stroke-width="1.5"/>
      <text x="50" y="35" text-anchor="middle" font-family="Arial" font-size="7" fill="#757575">FAULT</text>
      <circle cx="85" cy="15" r="7" fill="#4CAF50" stroke="#388E3C" stroke-width="1.5"/>
      <text x="85" y="35" text-anchor="middle" font-family="Arial" font-size="7" fill="#757575">TEST</text>
      <circle cx="120" cy="15" r="7" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <text x="120" y="35" text-anchor="middle" font-family="Arial" font-size="7" fill="#757575">ALARM</text>
    </g>
    <!-- Divider -->
    <rect x="130" y="238" width="140" height="1" fill="#BDBDBD"/>
    <!-- Control Buttons -->
    <g transform="translate(130, 255)">
      <!-- Silence button -->
      <rect x="5" y="0" width="55" height="30" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
      <text x="32" y="12" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">SILENCE</text>
      <text x="32" y="22" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">alarms</text>
      <!-- Reset button -->
      <rect x="70" y="0" width="55" height="30" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
      <text x="97" y="12" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">SYSTEM</text>
      <text x="97" y="22" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">RESET</text>
    </g>
    <g transform="translate(130, 295)">
      <!-- Evacuate button -->
      <rect x="5" y="0" width="55" height="30" rx="5" fill="#D32F2F" stroke="#B71C1C" stroke-width="1.5"/>
      <text x="32" y="12" text-anchor="middle" font-family="Arial" font-size="7" fill="#FFFFFF" font-weight="bold">GENERAL</text>
      <text x="32" y="22" text-anchor="middle" font-family="Arial" font-size="7" fill="#FFFFFF" font-weight="bold">EVACUATE</text>
      <!-- Drill button -->
      <rect x="70" y="0" width="55" height="30" rx="5" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
      <text x="97" y="12" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">DRILL</text>
      <text x="97" y="22" text-anchor="middle" font-family="Arial" font-size="7" fill="#424242" font-weight="bold">MODE</text>
    </g>
    <!-- Zone indicators -->
    <g transform="translate(130, 345)">
      <rect x="5" y="0" width="130" height="20" rx="3" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
      <text x="70" y="14" text-anchor="middle" font-family="monospace" font-size="8" fill="#424242">Z1:OK  Z2:OK  Z3:OK</text>
    </g>
    <!-- Key switch -->
    <circle cx="200" cy="410" r="15" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="2"/>
    <circle cx="200" cy="410" r="8" fill="#F5F5F5" stroke="#9E9E9E" stroke-width="1.5"/>
    <line x1="200" y1="405" x2="200" y2="415" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
    <text x="200" y="438" text-anchor="middle" font-family="Arial" font-size="7" fill="#9E9E9E">KEY SWITCH</text>
  </g>
</svg>