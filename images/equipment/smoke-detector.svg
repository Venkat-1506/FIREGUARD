<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ceiling" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    <linearGradient id="detector-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="100%" style="stop-color:#E8E8E8"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-10%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Ceiling -->
  <rect x="0" y="0" width="400" height="80" fill="url(#ceiling)"/>
  <rect x="0" y="78" width="400" height="3" fill="#BDBDBD"/>
  <g filter="url(#shadow2)">
    <!-- Mount bracket -->
    <rect x="160" y="75" width="80" height="20" rx="4" fill="#BDBDBD"/>
    <!-- Main body - ceiling mount -->
    <ellipse cx="200" cy="160" rx="110" ry="95" fill="url(#detector-body)" stroke="#BDBDBD" stroke-width="1.5"/>
    <!-- Ventilation slots ring -->
    <ellipse cx="200" cy="160" rx="90" ry="78" fill="none" stroke="#D0D0D0" stroke-width="1" stroke-dasharray="8,4"/>
    <!-- Smoke entry vents -->
    <rect x="145" y="120" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <rect x="145" y="130" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <rect x="145" y="140" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <rect x="225" y="120" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <rect x="225" y="130" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <rect x="225" y="140" width="30" height="3" rx="1.5" fill="#BDBDBD"/>
    <!-- Inner chamber -->
    <ellipse cx="200" cy="160" rx="55" ry="48" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1"/>
    <!-- Sensor chamber pattern -->
    <ellipse cx="200" cy="160" rx="35" ry="30" fill="none" stroke="#D0D0D0" stroke-width="0.8"/>
    <line x1="175" y1="145" x2="225" y2="145" stroke="#E0E0E0" stroke-width="0.8"/>
    <line x1="175" y1="160" x2="225" y2="160" stroke="#E0E0E0" stroke-width="0.8"/>
    <line x1="175" y1="175" x2="225" y2="175" stroke="#E0E0E0" stroke-width="0.8"/>
    <!-- LED indicator -->
    <circle cx="200" cy="115" r="5" fill="#D32F2F"/>
    <circle cx="200" cy="115" r="3" fill="#EF5350"/>
    <circle cx="200" cy="115" r="1.5" fill="#FFCDD2"/>
    <!-- Test button -->
    <circle cx="200" cy="195" r="10" fill="#E0E0E0" stroke="#BDBDBD" stroke-width="1"/>
    <text x="200" y="199" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="8" fill="#9E9E9E" font-weight="bold">TEST</text>
    <!-- Bottom ring -->
    <ellipse cx="200" cy="220" rx="80" ry="12" fill="#E0E0E0"/>
    <!-- Smoke waves (visual effect) -->
    <path d="M 130 90 Q 145 70 160 80 Q 175 90 170 70" fill="none" stroke="#D32F2F" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <path d="M 230 80 Q 245 60 260 70 Q 275 80 270 60" fill="none" stroke="#D32F2F" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  </g>
</svg>