<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="shield-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#B71C1C"/>
    </linearGradient>
    <linearGradient id="flame-g" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6F00"/>
      <stop offset="40%" style="stop-color:#FF8F00"/>
      <stop offset="70%" style="stop-color:#FFC107"/>
      <stop offset="100%" style="stop-color:#FFEB3B"/>
    </linearGradient>
    <linearGradient id="flame-inner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6F00"/>
      <stop offset="60%" style="stop-color:#FFAB00"/>
      <stop offset="100%" style="stop-color:#FFD54F"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#D32F2F" stroke-width="3"/>
  <circle cx="150" cy="150" r="132" fill="none" stroke="#D32F2F" stroke-width="1" opacity="0.3"/>
  <!-- Shield -->
  <path d="M 150 35 L 65 75 L 65 155 Q 65 220 150 270 Q 235 220 235 155 L 235 75 Z" fill="url(#shield-g)" stroke="#B71C1C" stroke-width="2"/>
  <path d="M 150 50 L 80 85 L 80 155 Q 80 210 150 255 Q 220 210 220 155 L 220 85 Z" fill="#FFFFFF" opacity="0.95"/>
  <!-- Shield inner border -->
  <path d="M 150 60 L 90 90 L 90 153 Q 90 203 150 245 Q 210 203 210 153 L 210 90 Z" fill="none" stroke="#D32F2F" stroke-width="1" opacity="0.2"/>
  <!-- Flame -->
  <path d="M 150 100 Q 120 140 125 170 Q 128 185 140 180 Q 135 165 150 145 Q 165 165 160 180 Q 172 185 175 170 Q 180 140 150 100 Z" fill="url(#flame-g)"/>
  <path d="M 150 125 Q 135 150 138 168 Q 140 178 148 175 Q 145 165 150 155 Q 155 165 152 175 Q 160 178 162 168 Q 165 150 150 125 Z" fill="url(#flame-inner)"/>
  <!-- Flame tip highlight -->
  <path d="M 150 110 Q 143 125 145 138 Q 148 145 150 140 Q 152 145 155 138 Q 157 125 150 110 Z" fill="#FFF9C4" opacity="0.8"/>
  <!-- Small fire extinguisher silhouette at bottom of shield -->
  <rect x="140" y="195" width="20" height="40" rx="4" fill="#D32F2F" opacity="0.7"/>
  <rect x="146" y="188" width="8" height="10" rx="2" fill="#D32F2F" opacity="0.7"/>
  <rect x="148" y="183" width="4" height="7" rx="1" fill="#D32F2F" opacity="0.5"/>
  <!-- Text arc - top -->
  <path id="topArc" d="M 45 150 A 105 105 0 0 1 255 150" fill="none"/>
  <text font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#D32F2F" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">FIRE SAFETY</textPath>
  </text>
  <!-- Text arc - bottom -->
  <path id="bottomArc" d="M 55 170 A 100 100 0 0 0 245 170" fill="none"/>
  <text font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#757575" letter-spacing="3">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">INSPECTION SYSTEM</textPath>
  </text>
  <!-- Small stars -->
  <polygon points="50,150 52,144 54,150 48,146 56,146" fill="#D32F2F" opacity="0.5"/>
  <polygon points="246,150 248,144 250,150 244,146 252,146" fill="#D32F2F" opacity="0.5"/>
</svg>