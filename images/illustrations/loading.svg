<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="load-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#load-bg)"/>
  <!-- Gear 1 (large) -->
  <g transform="translate(250, 170)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#D32F2F" stroke-width="4" opacity="0.2"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D32F2F" stroke-width="3" opacity="0.15"/>
    <circle cx="0" cy="0" r="12" fill="#D32F2F" opacity="0.2"/>
    <!-- Gear teeth -->
    <rect x="-8" y="-58" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2"/>
    <rect x="42" y="-8" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2"/>
    <rect x="-58" y="-8" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2"/>
    <rect x="-8" y="42" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2"/>
    <rect x="30" y="-46" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2" transform="rotate(45, 38, -38)"/>
    <rect x="-46" y="30" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2" transform="rotate(45, -38, 38)"/>
    <rect x="30" y="30" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2" transform="rotate(45, 38, 38)"/>
    <rect x="-46" y="-46" width="16" height="16" rx="3" fill="#D32F2F" opacity="0.2" transform="rotate(45, -38, -38)"/>
  </g>
  <!-- Gear 2 (small) -->
  <g transform="translate(310, 120)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#D32F2F" stroke-width="3" opacity="0.3"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#D32F2F" stroke-width="2" opacity="0.2"/>
    <circle cx="0" cy="0" r="7" fill="#D32F2F" opacity="0.3"/>
    <rect x="-6" y="-35" width="12" height="12" rx="2" fill="#D32F2F" opacity="0.3"/>
    <rect x="23" y="-6" width="12" height="12" rx="2" fill="#D32F2F" opacity="0.3"/>
    <rect x="-35" y="-6" width="12" height="12" rx="2" fill="#D32F2F" opacity="0.3"/>
    <rect x="-6" y="23" width="12" height="12" rx="2" fill="#D32F2F" opacity="0.3"/>
  </g>
  <!-- Loading dots -->
  <circle cx="200" cy="280" r="8" fill="#D32F2F" opacity="0.8">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.2s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="240" cy="280" r="8" fill="#D32F2F" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.2s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="280" cy="280" r="8" fill="#D32F2F" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <!-- Circular progress -->
  <circle cx="250" cy="170" r="65" fill="none" stroke="#FFCDD2" stroke-width="4" stroke-dasharray="8,6"/>
  <circle cx="250" cy="170" r="65" fill="none" stroke="#D32F2F" stroke-width="4" stroke-dasharray="100,310" stroke-linecap="round" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 250 170" to="360 250 170" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>