<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="err-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#err-bg)"/>
  <!-- Computer screen -->
  <rect x="130" y="60" width="240" height="170" rx="10" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
  <rect x="145" y="72" width="210" height="140" rx="4" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Screen content - error -->
  <circle cx="250" cy="115" r="28" fill="#FFEBEE" stroke="#D32F2F" stroke-width="2.5"/>
  <text x="250" y="125" text-anchor="middle" font-family="Arial" font-size="28" fill="#D32F2F" font-weight="bold">!</text>
  <rect x="185" y="155" width="130" height="8" rx="4" fill="#FFCDD2"/>
  <rect x="200" y="170" width="100" height="6" rx="3" fill="#FFCDD2" opacity="0.6"/>
  <rect x="210" y="183" width="80" height="6" rx="3" fill="#FFCDD2" opacity="0.4"/>
  <!-- Stand -->
  <rect x="235" y="230" width="30" height="20" fill="#E0E0E0"/>
  <rect x="210" y="250" width="80" height="10" rx="5" fill="#D0D0D0"/>
  <!-- Wrench -->
  <g transform="translate(340, 200) rotate(30)">
    <rect x="0" y="0" width="12" height="60" rx="4" fill="#9E9E9E"/>
    <circle cx="6" cy="5" r="12" fill="none" stroke="#9E9E9E" stroke-width="4"/>
    <rect x="-2" y="5" width="16" height="8" rx="2" fill="#9E9E9E"/>
  </g>
  <!-- Broken link chain -->
  <g transform="translate(90, 180)">
    <ellipse cx="20" cy="20" rx="18" ry="12" fill="none" stroke="#D32F2F" stroke-width="3" opacity="0.5"/>
    <ellipse cx="50" cy="20" rx="18" ry="12" fill="none" stroke="#D32F2F" stroke-width="3" opacity="0.5"/>
    <line x1="35" y1="14" x2="38" y2="26" stroke="#D32F2F" stroke-width="2" opacity="0.3" stroke-dasharray="2,2"/>
  </g>
  <!-- Decorative -->
  <circle cx="430" cy="80" r="6" fill="#D32F2F" opacity="0.1"/>
  <circle cx="70" cy="90" r="8" fill="#D32F2F" opacity="0.08"/>
  <circle cx="420" cy="300" r="10" fill="#D32F2F" opacity="0.1"/>
</svg>