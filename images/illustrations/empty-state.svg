<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="empty-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF5F5"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#empty-bg)"/>
  <!-- Clipboard -->
  <rect x="165" y="70" width="170" height="220" rx="12" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="2"/>
  <rect x="195" y="55" width="110" height="30" rx="8" fill="#D32F2F"/>
  <circle cx="210" cy="70" r="5" fill="#FFFFFF"/>
  <circle cx="290" cy="70" r="5" fill="#FFFFFF"/>
  <!-- Empty lines -->
  <rect x="190" y="115" width="120" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="190" y="135" width="90" height="6" rx="3" fill="#E8E8E8"/>
  <rect x="190" y="155" width="110" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="190" y="175" width="80" height="6" rx="3" fill="#E8E8E8"/>
  <rect x="190" y="195" width="100" height="6" rx="3" fill="#E0E0E0"/>
  <rect x="190" y="215" width="70" height="6" rx="3" fill="#E8E8E8"/>
  <!-- Magnifying glass -->
  <circle cx="310" cy="250" r="40" fill="none" stroke="#D32F2F" stroke-width="4" opacity="0.6"/>
  <line x1="340" y1="280" x2="370" y2="310" stroke="#D32F2F" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- Question mark in magnifier -->
  <text x="310" y="260" text-anchor="middle" font-family="Arial" font-size="32" fill="#D32F2F" opacity="0.4" font-weight="bold">?</text>
  <!-- Small decorative circles -->
  <circle cx="100" cy="320" r="8" fill="#D32F2F" opacity="0.1"/>
  <circle cx="120" cy="340" r="5" fill="#D32F2F" opacity="0.15"/>
  <circle cx="400" cy="100" r="10" fill="#D32F2F" opacity="0.1"/>
  <circle cx="420" cy="130" r="6" fill="#D32F2F" opacity="0.12"/>
</svg>