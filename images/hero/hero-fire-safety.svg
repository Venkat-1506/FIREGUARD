<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFF5F5"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D32F2F"/>
      <stop offset="100%" style="stop-color:#C62828"/>
    </linearGradient>
    <filter id="hero-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#hero-bg)"/>
  <!-- Decorative background circles -->
  <circle cx="650" cy="100" r="120" fill="#D32F2F" opacity="0.04"/>
  <circle cx="700" cy="150" r="80" fill="#D32F2F" opacity="0.06"/>
  <circle cx="100" cy="400" r="100" fill="#D32F2F" opacity="0.04"/>
  <g filter="url(#hero-shadow)">
    <!-- Building background -->
    <rect x="450" y="80" width="180" height="320" rx="6" fill="#F5F5F5" stroke="#E0E0E0" stroke-width="1.5"/>
    <rect x="470" y="100" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="520" y="100" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="570" y="100" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="470" y="150" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="520" y="150" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="570" y="150" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="470" y="200" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="520" y="200" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="570" y="200" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="470" y="250" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="520" y="250" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="570" y="250" width="40" height="35" rx="3" fill="#E3F2FD" opacity="0.6"/>
    <rect x="520" y="340" width="40" height="60" rx="3" fill="#BDBDBD"/>
    <!-- Second building -->
    <rect x="350" y="180" width="100" height="220" rx="4" fill="#EEEEEE" stroke="#E0E0E0" stroke-width="1"/>
    <rect x="365" y="200" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <rect x="400" y="200" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <rect x="365" y="235" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <rect x="400" y="235" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <rect x="365" y="270" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <rect x="400" y="270" width="25" height="22" rx="2" fill="#E3F2FD" opacity="0.5"/>
    <!-- Floor line -->
    <rect x="50" y="400" width="700" height="3" rx="1" fill="#E0E0E0"/>
    <!-- Inspector person -->
    <!-- Hard hat -->
    <ellipse cx="230" cy="155" rx="32" ry="14" fill="#FFC107"/>
    <rect x="205" y="148" width="50" height="10" rx="4" fill="#FFC107"/>
    <rect x="200" y="158" width="60" height="5" rx="2" fill="#F57F17"/>
    <!-- Head -->
    <circle cx="230" cy="185" r="28" fill="#FFCCBC"/>
    <!-- Face features -->
    <circle cx="222" cy="182" r="3" fill="#424242"/>
    <circle cx="240" cy="182" r="3" fill="#424242"/>
    <path d="M 222 195 Q 230 202 238 195" fill="none" stroke="#424242" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Safety vest -->
    <path d="M 200 215 L 195 310 L 265 310 L 260 215 Z" fill="url(#uniform)"/>
    <!-- Vest reflective stripes -->
    <rect x="195" y="240" width="70" height="5" fill="#FFEB3B" opacity="0.9"/>
    <rect x="195" y="270" width="70" height="5" fill="#FFEB3B" opacity="0.9"/>
    <!-- Vest pocket -->
    <rect x="205" y="250" width="22" height="18" rx="2" fill="#C62828"/>
    <!-- Clipboard in hand -->
    <rect x="260" y="240" width="50" height="65" rx="4" fill="#F5F5F5" stroke="#BDBDBD" stroke-width="1.5"/>
    <rect x="275" y="235" width="20" height="12" rx="3" fill="#9E9E9E"/>
    <!-- Clipboard paper -->
    <rect x="266" y="255" width="38" height="4" rx="1" fill="#D32F2F" opacity="0.3"/>
    <rect x="266" y="263" width="30" height="3" rx="1" fill="#E0E0E0"/>
    <rect x="266" y="270" width="34" height="3" rx="1" fill="#E0E0E0"/>
    <rect x="266" y="277" width="25" height="3" rx="1" fill="#E0E0E0"/>
    <rect x="266" y="284" width="32" height="3" rx="1" fill="#E0E0E0"/>
    <!-- Check marks on clipboard -->
    <path d="M 295 255 L 298 258 L 302 252" fill="none" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arm holding clipboard -->
    <rect x="255" y="230" width="15" height="30" rx="5" fill="#FFCCBC"/>
    <!-- Other arm pointing -->
    <rect x="180" y="230" width="15" height="50" rx="5" fill="#FFCCBC" transform="rotate(-15, 187, 255)"/>
    <!-- Legs -->
    <rect x="210" y="310" width="18" height="80" rx="5" fill="#37474F"/>
    <rect x="240" y="310" width="18" height="80" rx="5" fill="#37474F"/>
    <!-- Safety boots -->
    <rect x="205" y="385" width="28" height="15" rx="5" fill="#212121"/>
    <rect x="235" y="385" width="28" height="15" rx="5" fill="#212121"/>
    <!-- Fire extinguisher on wall -->
    <rect x="490" y="300" width="25" height="80" rx="5" fill="#D32F2F"/>
    <rect x="497" y="290" width="11" height="14" rx="3" fill="#424242"/>
    <rect x="493" y="296" width="5" height="8" rx="1" fill="#757575"/>
    <!-- Floor shadow -->
    <ellipse cx="230" cy="405" rx="80" ry="6" fill="#000" opacity="0.06"/>
    <!-- Clipboard shadow -->
    <ellipse cx="290" cy="315" rx="35" ry="4" fill="#000" opacity="0.05"/>
  </g>
</svg>